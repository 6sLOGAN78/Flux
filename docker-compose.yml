version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: flux-postgres
    environment:
      POSTGRES_DB: flux
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flux"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.0-M02-alpine
    container_name: flux-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: flux-backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SERVER_PORT=8080
      - DATABASE_URL=postgres://postgres:postgrespassword@postgres:5432/flux?sslmode=disable
      - REDIS_URL=redis:6379
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-super-secret-internal-token}
      - PLATFORM_DOMAIN=${PLATFORM_DOMAIN:-localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2.7.6-alpine
    container_name: flux-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-super-secret-internal-token}
      - PLATFORM_DOMAIN=${PLATFORM_DOMAIN:-localhost}
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
