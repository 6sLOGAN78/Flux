openapi: 3.0.3
info:
  title: Flux Growth API
  version: 2.0.0
  description: Campaign management, UTM building, and growth analytics endpoints.
paths:
  /api/v1/campaigns:
    post:
      summary: Create marketing campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                utm_source:
                  type: string
                utm_medium:
                  type: string
                utm_campaign:
                  type: string
                utm_term:
                  type: string
                utm_content:
                  type: string
      responses:
        '201':
          description: Campaign created
  /api/v1/campaigns/{id}/links:
    post:
      summary: Associate link with campaign and inject UTM parameters
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - destination_url
              properties:
                destination_url:
                  type: string
                custom_slug:
                  type: string
      responses:
        '200':
          description: Link associated and UTM parameters injected
