openapi: 3.0.3
info:
  title: Flux Enterprise API - Multi-Touch Attribution
  version: 4.0.0
  description: Multi-Touch Attribution Engine OpenAPI contract for Flux Enterprise.
paths:
  /api/v1/enterprise/attribution:
    get:
      summary: Get Multi-Touch Attribution Analytics
      description: Returns conversion and revenue attribution calculated via selected attribution model (first_touch, last_touch, linear, time_decay, position_based).
      tags:
        - Enterprise Attribution
      security:
        - BearerAuth: []
      parameters:
        - name: model
          in: query
          required: true
          description: Attribution model algorithm
          schema:
            type: string
            enum: [first_touch, last_touch, linear, time_decay, position_based]
            default: position_based
        - name: from
          in: query
          required: false
          description: ISO 8601 start timestamp
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: ISO 8601 end timestamp
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Attribution calculation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributionResult'
        '400':
          description: Invalid query parameters or unsupported model
        '401':
          description: Unauthorized
  /api/v1/enterprise/funnels/evaluate:
    post:
      summary: Evaluate Enterprise Conversion Funnel Drop-off
      description: Computes step-by-step conversion rates and visitor drop-off percentages for ordered multi-step funnels.
      tags:
        - Enterprise Funnels
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FunnelQueryPayload'
      responses:
        '200':
          description: Funnel drop-off evaluation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunnelAnalysisResult'
        '400':
          description: Invalid funnel steps payload
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CampaignAttribution:
      type: object
      required:
        - campaign_id
        - campaign_name
        - attributed_conversions
        - attributed_revenue
      properties:
        campaign_id:
          type: string
          format: uuid
        campaign_name:
          type: string
        attributed_conversions:
          type: number
          format: double
        attributed_revenue:
          type: number
          format: double
    AttributionResult:
      type: object
      required:
        - model
        - total_conversions
        - total_attributed_revenue
        - campaigns
      properties:
        model:
          type: string
          enum: [first_touch, last_touch, linear, time_decay, position_based]
        total_conversions:
          type: integer
        total_attributed_revenue:
          type: number
          format: double
        campaigns:
          type: array
          items:
            $ref: '#/components/schemas/CampaignAttribution'
    FunnelStepInput:
      type: object
      required:
        - step_order
        - name
        - link_id
      properties:
        step_order:
          type: integer
        name:
          type: string
        link_id:
          type: string
          format: uuid
    FunnelQueryPayload:
      type: object
      required:
        - funnel_name
        - steps
      properties:
        funnel_name:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/FunnelStepInput'
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    FunnelStepResult:
      type: object
      required:
        - step_order
        - name
        - link_id
        - visitors
        - overall_conversion_pct
        - step_conversion_pct
        - drop_off_count
        - drop_off_pct
      properties:
        step_order:
          type: integer
        name:
          type: string
        link_id:
          type: string
          format: uuid
        visitors:
          type: integer
        overall_conversion_pct:
          type: number
          format: double
        step_conversion_pct:
          type: number
          format: double
        drop_off_count:
          type: integer
        drop_off_pct:
          type: number
          format: double
    FunnelAnalysisResult:
      type: object
      required:
        - funnel_name
        - total_started
        - total_converted
        - final_conversion_pct
        - steps
      properties:
        funnel_name:
          type: string
        total_started:
          type: integer
        total_converted:
          type: integer
        final_conversion_pct:
          type: number
          format: double
        steps:
          type: array
          items:
            $ref: '#/components/schemas/FunnelStepResult'
