openapi: 3.0.3
info:
  title: Flux Enterprise API - Multi-Touch Attribution
  version: 4.0.0
  description: Multi-Touch Attribution Engine OpenAPI contract for Flux Enterprise.
paths:
  /api/v1/enterprise/attribution:
    get:
      summary: Get Multi-Touch Attribution Analytics
      description: Returns conversion and revenue attribution calculated via selected attribution model (first_touch, last_touch, linear, time_decay, position_based).
      tags:
        - Enterprise Attribution
      security:
        - BearerAuth: []
      parameters:
        - name: model
          in: query
          required: true
          description: Attribution model algorithm
          schema:
            type: string
            enum: [first_touch, last_touch, linear, time_decay, position_based]
            default: position_based
        - name: from
          in: query
          required: false
          description: ISO 8601 start timestamp
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: ISO 8601 end timestamp
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Attribution calculation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributionResult'
        '400':
          description: Invalid query parameters or unsupported model
        '401':
          description: Unauthorized
  /api/v1/enterprise/funnels/evaluate:
    post:
      summary: Evaluate Enterprise Conversion Funnel Drop-off
      description: Computes step-by-step conversion rates and visitor drop-off percentages for ordered multi-step funnels.
      tags:
        - Enterprise Funnels
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FunnelQueryPayload'
      responses:
        '200':
          description: Funnel drop-off evaluation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunnelAnalysisResult'
        '400':
          description: Invalid funnel steps payload
  /api/v1/enterprise/metrics/roi:
    get:
      summary: Get Financial Marketing Revenue Metrics (LTV, ROAS, CAC, ROI)
      description: Calculates financial marketing metrics (CAC, ROAS, ROI, LTV, LTV:CAC) for shortened link campaigns.
      tags:
        - Enterprise Revenue Analytics
      security:
        - BearerAuth: []
      parameters:
        - name: campaign_id
          in: query
          required: false
          description: Optional Campaign UUID filter
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Financial revenue metrics summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueSummaryResult'
        '401':
          description: Unauthorized
  /api/v1/ai/generate-slugs:
    post:
      summary: Generate AI Short Slug Suggestions
      description: Generates short, catchy, SEO-optimized URL slugs from target web page title or content.
      tags:
        - Enterprise AI Engine
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  format: uri
                title:
                  type: string
      responses:
        '200':
          description: AI suggested slugs list
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items:
                      type: string
  /api/v1/ai/summarize-campaign:
    post:
      summary: Generate AI Executive Campaign Summary Brief
      description: Generates executive plain-English summary brief for marketing campaign performance.
      tags:
        - Enterprise AI Engine
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - campaign_id
              properties:
                campaign_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Campaign summary brief
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    type: string
  /api/v1/ai/detect-anomalies:
    post:
      summary: Detect Statistical Click Traffic Anomalies (Z-Score)
      description: Evaluates rolling Z-score traffic variance and bot percentage to identify traffic spikes, drops, or bot surges.
      tags:
        - Enterprise AI Engine
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - link_id
                - historical_counts
                - current_count
              properties:
                link_id:
                  type: string
                  format: uuid
                historical_counts:
                  type: array
                  items:
                    type: number
                current_count:
                  type: number
                bot_percentage:
                  type: number
      responses:
        '200':
          description: Anomaly detection result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnomalyDetectionResult'
  /api/v1/ai/predict-ctr:
    post:
      summary: Forecast Predictive Link CTR (Click-Through Rate)
      description: Predicts future link CTR trend using linear regression forecasting.
      tags:
        - Enterprise AI Engine
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - link_id
                - impressions
                - clicks
              properties:
                link_id:
                  type: string
                  format: uuid
                impressions:
                  type: array
                  items:
                    type: integer
                clicks:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: CTR prediction result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CTRPredictionResult'
  /api/v1/enterprise/sso/saml/acs:
    post:
      summary: SAML 2.0 Assertion Consumer Service (ACS) Endpoint
      description: Validates SAML 2.0 identity provider responses and authenticates enterprise SSO sessions.
      tags:
        - Enterprise SSO
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - entity_id
                - name_id
              properties:
                entity_id:
                  type: string
                name_id:
                  type: string
                  format: email
                session_index:
                  type: string
      responses:
        '200':
          description: SAML authentication validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SAMLValidationResult'
  /scim/v2/Users:
    post:
      summary: SCIM 2.0 User Provisioning Endpoint
      description: Provisions a new enterprise user directory record via SCIM 2.0 protocol.
      tags:
        - SCIM 2.0 Provisioning
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SCIMUser'
      responses:
        '201':
          description: SCIM user provisioned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMUser'
  /scim/v2/Users/{id}:
    put:
      summary: SCIM 2.0 Update User Directory Record
      description: Updates or deactivates an enterprise user account.
      tags:
        - SCIM 2.0 Provisioning
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SCIMUser'
      responses:
        '200':
          description: SCIM user record updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SCIMUser'
    delete:
      summary: SCIM 2.0 Deprovision User
      description: Deprovisions (deactivates/deletes) an enterprise user account.
      tags:
        - SCIM 2.0 Provisioning
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: User deprovisioned successfully
  /api/v1/enterprise/whitelabel:
    get:
      summary: Get Enterprise White-Label Configuration
      description: Returns custom branding configuration, logo, favicon, colors, and DKIM domain setup for organization.
      tags:
        - Enterprise White-Label
      security:
        - BearerAuth: []
      responses:
        '200':
          description: White-label configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhiteLabelConfig'
    put:
      summary: Update Enterprise White-Label Branding
      description: Updates custom branding logo, favicon, primary/accent colors, custom CSS overrides, and DKIM signing configs.
      tags:
        - Enterprise White-Label
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhiteLabelConfig'
      responses:
        '200':
          description: Updated white-label configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhiteLabelConfig'
  /api/v1/enterprise/whitelabel/theme.css:
    get:
      summary: Get Compiled Tenant CSS Theme Variables
      description: Serves compiled `:root` CSS variables and sanitized CSS overrides for custom subdomains.
      tags:
        - Enterprise White-Label
      responses:
        '200':
          description: Compiled CSS stylesheet
          content:
            text/css:
              schema:
                type: string
  /api/v1/enterprise/abuse/scan:
    post:
      summary: Trigger Real-Time Abuse & Malware URL Scan
      description: Evaluates target URL against Google Safe Browsing, VirusTotal, and internal malware blocklists.
      tags:
        - Enterprise Abuse Moderation
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - link_id
                - url
              properties:
                link_id:
                  type: string
                  format: uuid
                url:
                  type: string
                  format: uri
      responses:
        '200':
          description: Security scan evaluation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResult'
  /api/v1/enterprise/abuse/quarantine:
    post:
      summary: Admin Link Quarantine & Legal Takedown Trigger
      description: Suspends an abusive/malicious link returning HTTP 451 Unavailable For Legal Reasons on user access.
      tags:
        - Enterprise Abuse Moderation
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - link_id
                - reason
              properties:
                link_id:
                  type: string
                  format: uuid
                reason:
                  type: string
      responses:
        '200':
          description: Link successfully quarantined
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CampaignAttribution:
      type: object
      required:
        - campaign_id
        - campaign_name
        - attributed_conversions
        - attributed_revenue
      properties:
        campaign_id:
          type: string
          format: uuid
        campaign_name:
          type: string
        attributed_conversions:
          type: number
          format: double
        attributed_revenue:
          type: number
          format: double
    AttributionResult:
      type: object
      required:
        - model
        - total_conversions
        - total_attributed_revenue
        - campaigns
      properties:
        model:
          type: string
          enum: [first_touch, last_touch, linear, time_decay, position_based]
        total_conversions:
          type: integer
        total_attributed_revenue:
          type: number
          format: double
        campaigns:
          type: array
          items:
            $ref: '#/components/schemas/CampaignAttribution'
    FunnelStepInput:
      type: object
      required:
        - step_order
        - name
        - link_id
      properties:
        step_order:
          type: integer
        name:
          type: string
        link_id:
          type: string
          format: uuid
    FunnelQueryPayload:
      type: object
      required:
        - funnel_name
        - steps
      properties:
        funnel_name:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/FunnelStepInput'
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    FunnelStepResult:
      type: object
      required:
        - step_order
        - name
        - link_id
        - visitors
        - overall_conversion_pct
        - step_conversion_pct
        - drop_off_count
        - drop_off_pct
      properties:
        step_order:
          type: integer
        name:
          type: string
        link_id:
          type: string
          format: uuid
        visitors:
          type: integer
        overall_conversion_pct:
          type: number
          format: double
        step_conversion_pct:
          type: number
          format: double
        drop_off_count:
          type: integer
        drop_off_pct:
          type: number
          format: double
    FunnelAnalysisResult:
      type: object
      required:
        - funnel_name
        - total_started
        - total_converted
        - final_conversion_pct
        - steps
      properties:
        funnel_name:
          type: string
        total_started:
          type: integer
        total_converted:
          type: integer
        final_conversion_pct:
          type: number
          format: double
        steps:
          type: array
          items:
            $ref: '#/components/schemas/FunnelStepResult'
    CampaignRevenueMetrics:
      type: object
      required:
        - campaign_id
        - spend
        - revenue
        - customers_acquired
        - cac
        - roas
        - roi_pct
        - ltv
        - ltv_to_cac_ratio
      properties:
        campaign_id:
          type: string
          format: uuid
        campaign_name:
          type: string
        spend:
          type: number
          format: double
        revenue:
          type: number
          format: double
        customers_acquired:
          type: integer
        cac:
          type: number
          format: double
        roas:
          type: number
          format: double
        roi_pct:
          type: number
          format: double
        ltv:
          type: number
          format: double
        ltv_to_cac_ratio:
          type: number
          format: double
    RevenueSummaryResult:
      type: object
      required:
        - total_spend
        - total_revenue
        - total_customers
        - overall_cac
        - overall_roas
        - overall_roi_pct
        - overall_ltv
        - campaigns
      properties:
        total_spend:
          type: number
          format: double
        total_revenue:
          type: number
          format: double
        total_customers:
          type: integer
        overall_cac:
          type: number
          format: double
        overall_roas:
          type: number
          format: double
        overall_roi_pct:
          type: number
          format: double
        overall_ltv:
          type: number
          format: double
        campaigns:
          type: array
          items:
            $ref: '#/components/schemas/CampaignRevenueMetrics'
    AnomalyDetectionResult:
      type: object
      required:
        - link_id
        - is_anomaly
        - z_score
        - summary
      properties:
        link_id:
          type: string
          format: uuid
        is_anomaly:
          type: boolean
        anomaly_type:
          type: string
          enum: [traffic_spike, traffic_drop, bot_surge]
        z_score:
          type: number
          format: double
        confidence_score:
          type: number
          format: double
        summary:
          type: string
    CTRPredictionResult:
      type: object
      required:
        - link_id
        - historical_ctr
        - predicted_ctr
        - trend
        - confidence
      properties:
        link_id:
          type: string
          format: uuid
        historical_ctr:
          type: number
          format: double
        predicted_ctr:
          type: number
          format: double
        trend:
          type: string
          enum: [upward, downward, stable]
        confidence:
          type: number
          format: double
    SAMLValidationResult:
      type: object
      required:
        - is_valid
        - user_email
      properties:
        is_valid:
          type: boolean
        user_email:
          type: string
          format: email
        session_index:
          type: string
    SCIMUser:
      type: object
      required:
        - userName
        - active
      properties:
        schemas:
          type: array
          items:
            type: string
        id:
          type: string
        userName:
          type: string
          format: email
        active:
          type: boolean
    WhiteLabelConfig:
      type: object
      required:
        - brand_name
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        dashboard_domain:
          type: string
        brand_name:
          type: string
        logo_url:
          type: string
          format: uri
        favicon_url:
          type: string
          format: uri
        primary_color:
          type: string
        accent_color:
          type: string
        custom_css:
          type: string
        hide_footer:
          type: boolean
        dkim_selector:
          type: string
        dkim_domain:
          type: string
    ScanResult:
      type: object
      required:
        - is_safe
      properties:
        is_safe:
          type: boolean
        threat_type:
          type: string
          enum: [malware, phishing, social_engineering, malformed_url]
        threat_provider:
          type: string
          enum: [google_safe_browsing, virustotal, internal_validator]
        reason:
          type: string
