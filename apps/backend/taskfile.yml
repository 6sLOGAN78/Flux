version: '3'

tasks:
  help:
    desc: print this help message
    cmds:
    - task --list-all
    silent: true

  run:
    desc: run the cmd/flux application
    cmds:
    - go run ./cmd/flux

  migrations:new:
    desc: create a new database migration
    vars:
      NAME: '{{.name | default ""}}'
    cmds:
    - |
      if [ -z "{{.NAME}}" ]; then
        echo "Error: name parameter is required"
        echo "Usage: task migrations:new name=migration_name"
        exit 1
      fi
    - echo 'Creating migration file for {{.NAME}}...'
    - tern new -m ./internal/database/migrations {{.NAME}}

  migrate:
    desc: apply embedded database migrations using FLUX_DATABASE configuration
    dir: '{{.TASKFILE_DIR}}'
    cmds:
    - go run ./cmd/migrator

  migrate:check:
    desc: apply and repeat embedded migrations non-interactively for CI
    dir: '{{.TASKFILE_DIR}}'
    cmds:
    - task: migrate
    - task: migrate

  migrations:up:
    desc: compatibility alias for explicit embedded migrations
    cmds:
    - task: migrate

  tidy:
    desc: format all .go files, and tidy and vendor module dependencies
    cmds:
    - echo 'Formatting .go files...'
    - go fmt ./...
    - echo 'Tidying module dependencies...'
    - go mod tidy
    - echo 'Verifying dependencies...'
    - go mod verify
