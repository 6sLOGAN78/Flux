version: '3'

vars:
  BIN_DIR: '{{.TASKFILE_DIR}}/build/bin'

tasks:
  help:
    desc: print this help message
    cmds:
    - task --list-all
    silent: true

  run:
    desc: run the API role through the legacy Flux compatibility command
    dir: '{{.TASKFILE_DIR}}'
    cmds:
    - go run ./cmd/flux

  run:api:
    desc: run only the API role (explicit migrations are separate)
    dir: '{{.TASKFILE_DIR}}'
    cmds:
    - go run ./cmd/api

  run:redirector:
    desc: run only the redirector role
    dir: '{{.TASKFILE_DIR}}'
    cmds:
    - go run ./cmd/redirector

  run:worker:
    desc: run only the worker role and its management listener
    dir: '{{.TASKFILE_DIR}}'
    cmds:
    - go run ./cmd/worker

  run:migrator:
    desc: apply embedded migrations and exit
    dir: '{{.TASKFILE_DIR}}'
    cmds:
    - go run ./cmd/migrator

  build:
    desc: build all four independently deployable role binaries
    cmds:
    - task: build:api
    - task: build:redirector
    - task: build:worker
    - task: build:migrator

  build:api:
    desc: build the API binary
    dir: '{{.TASKFILE_DIR}}'
    cmds:
    - go build -o '{{.BIN_DIR}}/api' ./cmd/api

  build:redirector:
    desc: build the redirector binary
    dir: '{{.TASKFILE_DIR}}'
    cmds:
    - go build -o '{{.BIN_DIR}}/redirector' ./cmd/redirector

  build:worker:
    desc: build the worker binary
    dir: '{{.TASKFILE_DIR}}'
    cmds:
    - go build -o '{{.BIN_DIR}}/worker' ./cmd/worker

  build:migrator:
    desc: build the one-shot migrator binary
    dir: '{{.TASKFILE_DIR}}'
    cmds:
    - go build -o '{{.BIN_DIR}}/migrator' ./cmd/migrator

  migrations:new:
    desc: create a new database migration
    vars:
      NAME: '{{.name | default ""}}'
    cmds:
    - |
      if [ -z "{{.NAME}}" ]; then
        echo "Error: name parameter is required"
        echo "Usage: task migrations:new name=migration_name"
        exit 1
      fi
    - echo 'Creating migration file for {{.NAME}}...'
    - tern new -m ./internal/database/migrations {{.NAME}}

  migrate:
    desc: apply embedded database migrations using FLUX_DATABASE configuration
    dir: '{{.TASKFILE_DIR}}'
    cmds:
    - go run ./cmd/migrator

  migrate:check:
    desc: apply and repeat embedded migrations non-interactively for CI
    dir: '{{.TASKFILE_DIR}}'
    cmds:
    - task: migrate
    - task: migrate

  migrations:up:
    desc: compatibility alias for explicit embedded migrations
    cmds:
    - task: migrate

  tidy:
    desc: format all .go files, and tidy and vendor module dependencies
    cmds:
    - echo 'Formatting .go files...'
    - go fmt ./...
    - echo 'Tidying module dependencies...'
    - go mod tidy
    - echo 'Verifying dependencies...'
    - go mod verify
