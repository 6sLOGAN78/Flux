title = "Flux secret scanning — pinned default rules"

[extend]
useDefault = true

# No directory baselines, inline allow comments or credential allowlists.
# Synthetic scanner credentials are generated only in disposable runtime trees.

# Keep all prefixed formats. Legacy bare hex needs a provider-named assignment;
# a provider mention elsewhere in a report must not turn Git commits into tokens.
[[rules]]
id = "sourcegraph-access-token"
regex = '''(?i)(?:\bsgp_(?:(?:[a-f0-9]{16}|local)_)?|(?:sourcegraph|src_access_token)[ \t\w.-]{0,30}[\s'"]{0,3}(?:=|>|:{1,3}=|\|\||:|=>|\?=|,)[\x60'"\s=]{0,5})([a-f0-9]{40})(?:[\x60'"\s;]|\\[nr]|$)'''
secretGroup = 1
entropy = 3
keywords = ["sgp_", "sourcegraph", "src_access_token"]
